<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <!-- Nhúng Bootstrap CSS cho giao diện đẹp -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="text-center mb-4">Đăng Ký Tài Khoản</h2>
        
        <!-- Yêu cầu: action, method="POST" -->
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            
            <!-- Trường Họ và tên (name="name") -->
            <div class="mb-3">
                <label for="name" class="form-label fw-bold">Họ và tên</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Nhập họ và tên..." required>
            </div>

            <!-- Trường Email (name="email") -->
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Nhập địa chỉ email..." required>
            </div>

            <!-- Trường Số điện thoại (name="phone") -->
            <div class="mb-3">
                <label for="phone" class="form-label fw-bold">Số điện thoại</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="Nhập số điện thoại..." required>
            </div>

            <!-- Trường Giới tính (name="gender") -->
            <div class="mb-4">
                <label class="form-label fw-bold d-block">Giới tính</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked>
                    <label class="form-check-input-label" for="male">Nam</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                    <label class="form-check-input-label" for="female">Nữ</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="other" value="other">
                    <label class="form-check-input-label" for="other">Khác</label>
                </div>
            </div>

            <!-- Nút Submit -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Gửi Đăng Ký</button>
            </div>

        </form>
    </div>

</body>
</html>
