<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Color - Analogous</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1e1e1e; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        
        /* Thanh Topbar giả lập Adobe */
        .topbar { background-color: #252525; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
        .logo { font-size: 20px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 10px; }
        .logo span { color: #ff3366; font-size: 24px; }
        .rule-selector { background: #333; padding: 8px 15px; border-radius: 4px; font-size: 14px; border: 1px solid #555; display: flex; align-items: center; gap: 10px; }
        
        /* Vùng chứa màu */
        .color-container { display: flex; flex: 1; width: 100%; }
        .color-swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 30px; transition: flex 0.3s; cursor: pointer; }
        .color-swatch:hover { flex: 1.1; }
        .hex-code { background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 16px; backdrop-filter: blur(5px); }

        /* Nút giả lập ở dưới cùng */
        .bottom-bar { background-color: #252525; padding: 15px; text-align: center; border-top: 1px solid #333; }
        .btn { background: #1473e6; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Thanh công cụ -->
    <div class="topbar">
        <div class="logo"><span>◉</span> Adobe Color</div>
        <div class="rule-selector">
            Quy tắc màu: <strong>Analogous</strong> ▼
        </div>
        <div style="font-size: 14px; color: #aaa;">My Color Theme</div>
    </div>

    <!-- Bảng màu (5 màu tương đồng chuẩn công nghệ) -->
    <div class="color-container">
        <div class="color-swatch" style="background-color: #0F172A;">
            <div class="hex-code">#0F172A</div>
        </div>
        <div class="color-swatch" style="background-color: #1D4ED8;">
            <div class="hex-code">#1D4ED8</div>
        </div>
        <div class="color-swatch" style="background-color: #3B82F6;">
            <div class="hex-code">#3B82F6</div>
        </div>
        <div class="color-swatch" style="background-color: #60A5FA;">
            <div class="hex-code">#60A5FA</div>
        </div>
        <div class="color-swatch" style="background-color: #93C5FD;">
            <div class="hex-code">#93C5FD</div>
        </div>
    </div>

    <!-- Thanh dưới -->
    <div class="bottom-bar">
        <button class="btn">Lưu bộ màu (Save Theme)</button>
    </div>

</body>
</html>
